name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download uv
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvtmp
          Copy-Item (Get-ChildItem uvtmp -Recurse -Filter uv.exe | Select-Object -First 1).FullName installer\uv.exe
          installer\uv.exe --version

      - name: Bundle Python 3.12 (без junction-ссылок)
        shell: pwsh
        run: |
          installer\uv.exe python install 3.12 --install-dir "$env:RUNNER_TEMP\pyroot"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\pyroot" -Directory |
                 Where-Object { $_.Name -like "cpython-3.12.*" -and -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } |
                 Select-Object -First 1
          if (-not $dir) { throw "python not found" }
          Copy-Item $dir.FullName installer\python -Recurse
          installer\python\python.exe --version
          Copy-Item installer\python "$env:RUNNER_TEMP\ci-python" -Recurse

      - name: Self-test (CPU, без моделей)
        shell: pwsh
        run: |
          $py = "$env:RUNNER_TEMP\ci-python\python.exe"
          installer\uv.exe pip install --python $py --system --break-system-packages --torch-backend cpu -r requirements.txt
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONUTF8 = "1"
          $env:GOLOS_SHOTS = "$PWD\shots"
          $env:QT_QPA_FONTDIR = "C:\Windows\Fonts"
          $ErrorActionPreference = "Continue"
          $out = & $py -m golos.selftest 2>&1 | Out-String
          Write-Host $out
          Write-Host "selftest exit code: $LASTEXITCODE"
          # сбой Qt/torch при выгрузке процесса после завершения проверок не считаем провалом
          if ($out -match "SELFTEST OK" -and $out -match "Qwen3TTSModel") { exit 0 }
          exit 1

      - name: CLI self-test (без моделей)
        shell: pwsh
        run: |
          $py = "$env:RUNNER_TEMP\ci-python\python.exe"
          $env:PYTHONUTF8 = "1"
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          '{"lang":"en","voice":"dry","segments":[{"id":"s1","text":"In 2008, about 99% of $10T moved."},{"id":"s2","text":"Nvidia and TSMC grew in the 1990s."}]}' | Set-Content -Encoding utf8 job.json
          & $py -m golos.cli synth --job job.json --out cli_out --dry-run
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $r = Get-Content cli_out\result.json -Raw | ConvertFrom-Json
          if ($r.ok -ne 2) { Write-Host (Get-Content cli_out\result.json -Raw); exit 1 }
          $m = Get-Content cli_out\s1.json -Raw | ConvertFrom-Json
          Write-Host "spoken: $($m.spoken_text)"
          if ($m.words.Count -ne 7) { exit 1 }
          if (-not (Test-Path cli_out\s1.wav)) { exit 1 }
          Write-Host "CLI OK"

      - name: Publish screenshots to ci-shots branch
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          git config user.name "golos-ci"; git config user.email "ci@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "shots-repo"
          git init -q $tmp
          Copy-Item shots\* $tmp
          git -C $tmp add -A
          git -C $tmp -c user.name="golos-ci" -c user.email="ci@users.noreply.github.com" commit -qm "shots ${{ github.sha }}"
          git -C $tmp push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: shots/

      - name: Build installer
        id: build
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { (Select-String -Path golos\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$ver" installer\golos.iss
          Get-ChildItem dist
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: Golos-Setup
          path: dist/*.exe

      - name: Release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: Golos ${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Скачайте **Golos-Setup-${{ steps.build.outputs.version }}.exe** ниже и запустите.
            Установщик сам скачает компоненты (~3–4 ГБ); модели голоса загрузятся при первом использовании.
          files: dist/*.exe
